[General]
network = flora.simulations.LoRaNetworkTestOmer
sim-time-limit = 1d
repeat = 30
simtime-resolution = -11
######################################
# Randomness
######################################
rng-class = "cMersenneTwister"
######################################
# Output
######################################
**.vector-recording = true
output-vector-file = "results/${runid}.vec"
output-scalar-file = "results/${runid}.sca"
######################################
# General Parameters
######################################
**.alohaChannelModel = false
**.maxTransmissionDuration = 4s
**.energyDetection = -110dBm
**.displayAddresses = false
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 0m
**.sigma = 3.57
LoRaNetworkTestOmer.**.radio.separateTransmissionParts = false
LoRaNetworkTestOmer.**.radio.separateReceptionParts = false
**.radio.radioMediumModule = "LoRaMedium"
**.LoRaMedium.pathLossType = "LoRaLogNormalShadowing"
**.minInterferenceTime = 0s

######################################
# Main LoRa Gateway (Uplink Only)
######################################
**.numberOfGateways = 1
**.loRaGW[0].numUdpApps = 1
**.loRaGW[0].packetForwarder.localPort = 2000
**.loRaGW[0].packetForwarder.destPort = 1000
**.loRaGW[0].packetForwarder.destAddresses = "networkServer"
**.loRaGW[0].packetForwarder.indexNumber = 0
**.loRaGW[0].**.initialX = 200.00m
**.loRaGW[0].**.initialY = 200.00m
**.LoRaGWNic.radio.iAmGateway = true
**.loRaGW[*].**.initFromDisplayString = false

######################################
# Network Server (Simplified - LoRa Processing Only)
######################################
**.networkServer.numApps = 1

# App[0] - Main receiver (receives from cattle via gateway)
**.networkServer.app[0].typename = "NetworkServerApp"
**.networkServer.app[0].destAddresses = "loRaGW[0]"
**.networkServer.app[0].destPort = 2000
**.networkServer.app[0].localPort = 1000
**.networkServer.app[0].adrMethod = "avg"

######################################
# SOLUTION: Dedicated Alert Transmitter (Pure LoRa Node)
######################################
**.numberOfAlertTransmitters = 1
**.alertTransmitter[0].numApps = 1
**.alertTransmitter[0].**.initialX = 500.00m  # Center of area for maximum coverage
**.alertTransmitter[0].**.initialY = 500.00m
**.alertTransmitter[0].**.initFromDisplayString = false

# Single LoRa app - broadcasts alerts periodically
**.alertTransmitter[0].app[0].typename = "SimpleLoRaApp"
**.alertTransmitter[0].app[0].startTime = 600s  # Start after 10 minutes
**.alertTransmitter[0].app[0].sendInterval = exponential(120min)  # Alert every ~2 hours
**.alertTransmitter[0].app[0].packetName = "ALERT_BROADCAST"

# High-power LoRa parameters for maximum range
**.alertTransmitter[0].**.initialLoRaSF = 12    # Maximum spreading factor
**.alertTransmitter[0].**.initialLoRaTP = 20dBm # Maximum transmission power
**.alertTransmitter[0].**.initialLoRaBW = 125kHz
**.alertTransmitter[0].**.initialLoRaCR = 4
**.alertTransmitter[0].**.evaluateADRinNode = false

# Energy config for alert transmitter
**.alertTransmitter[0].LoRaNic.radio.energyConsumer.typename = "LoRaEnergyConsumer"
**.alertTransmitter[0].**.energySourceModule = "^.IdealEpEnergyStorage"
**.alertTransmitter[0].LoRaNic.radio.energyConsumer.configFile = xmldoc("energyConsumptionParameters.xml")

######################################
# Cattle Nodes - Enhanced with Alert Reception
######################################
**.numberOfCattle = 5

# Each cattle has ONE LoRa app that handles both uplink data AND alert reception
**.cattle[*].numApps = 1
**.cattle[*].app[0].typename = "SimpleLoRaApp"
**.cattle[*].app[0].startTime = uniform(60s, 300s)  # Staggered start
**.cattle[*].app[0].sendInterval = exponential(30min)  # Normal transmission rate
**.cattle[*].app[0].packetName = "CATTLE_DATA"

# Positioning and mobility
**.cattle[*].initialX = uniform(50m, 950m)
**.cattle[*].initialY = uniform(50m, 950m)
**.cattle[*].mobility.typename = "RandomWaypointMobility"
**.cattle[*].mobility.speed = uniform(0.5mps, 1.5mps)
**.cattle[*].mobility.waitTime = exponential(60s)

# LoRa parameters for cattle (optimized for reception)
**.cattle[*].**.initialLoRaSF = 12      # Match alert transmitter
**.cattle[*].**.initialLoRaTP = 14dBm   # Standard power for uplink
**.cattle[*].**.initialLoRaBW = 125kHz  # Match alert transmitter
**.cattle[*].**.initialLoRaCR = 4       # Match alert transmitter
**.cattle[*].**.initFromDisplayString = false
**.cattle[*].**.evaluateADRinNode = true

# Energy config
**.cattle[*].LoRaNic.radio.energyConsumer.typename = "LoRaEnergyConsumer"
**.cattle[*].**.energySourceModule = "^.IdealEpEnergyStorage"
**.cattle[*].LoRaNic.radio.energyConsumer.configFile = xmldoc("energyConsumptionParameters.xml")


######################################
# Predator Nodes
######################################
**.numberOfPredators = 1
**.predators[*].numApps = 0
**.predators[*].initialX = uniform(0m, 1000m)
**.predators[*].initialY = uniform(0m, 1000m)
**.predators[*].mobility.typename = "RandomWaypointMobility"
**.predators[*].mobility.speed = uniform(2mps, 4mps)
**.predators[*].mobility.waitTime = exponential(30s)

######################################
# Optional: Emergency Relay Nodes
######################################
**.numberOfEmergencyNodes = 0  # Set to 2 if you want relay nodes


######################################
# IPv4 config
######################################
**.ipv4Delayer.config = xmldoc("cloudDelays.xml")

######################################
# LOGICAL COMMUNICATION FLOW:
######################################
# 1. UPLINK DATA FLOW:
#    Cattle[*] --LoRa--> Gateway --IP--> NetworkServer
#
# 2. ALERT BROADCAST FLOW:
#    AlertTransmitter --LoRa--> ALL Cattle (broadcast)
#
# 3. ALERT RECEPTION:
#    Cattle receive alerts and can modify their behavior
#  
#
# 4. NO SOCKET CONNECTIONS between LoRa nodes
#    - Only Gateway <-> NetworkServer uses IP/UDP
#    - All LoRa nodes communicate via LoRa medium only
#
######################################

######################################
# Key Features:
######################################
# ✓ Pure LoRa communication for alerts (no socket errors)
# ✓ Alert transmitter positioned for optimal coverage
# ✓ High-power broadcasting for maximum range
# ✓ Cattle can receive alerts through normal LoRa reception
# ✓ Simple, clean architecture without IP complexity
# ✓ Scalable - can add more alert transmitters if needed
######################################
